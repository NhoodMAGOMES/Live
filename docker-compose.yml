services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: livepulse
      POSTGRES_USER: live
      POSTGRES_PASSWORD: live
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U live -d livepulse"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    ports:
      - "${API_PUBLIC_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    env_file: .env
    command: celery -A app.worker.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    env_file: .env
    command: celery -A app.worker.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      worker:
        condition: service_started

  web:
    build: ./web
    environment:
      NODE_ENV: development
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${WEB_PUBLIC_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

  minio:
    image: minio/minio:latest
    profiles: ["object-storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: live
      MINIO_ROOT_PASSWORD: livepulse-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
